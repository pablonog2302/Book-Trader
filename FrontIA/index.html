<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page">
        <section class="login-panel" aria-labelledby="login-heading">
            <header class="page-header">
                <p class="eyebrow">Acesso seguro</p>
                <h1 id="login-heading">Entrar</h1>
                <p class="intro">Informe seus dados para acessar o sistema.</p>
            </header>


            
            <form id="loginForm">

                <div class="form-field">
                    <label for="cpf">CPF</label>
                    <input id="cpf" name="cpf" type="text" autocomplete="username" required>
                </div>

                <div class="form-field">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
                </div>
                <button id="submit-button" type="submit">Entrar</button>
                <p id="feedback" class="message" role="status" aria-live="polite"></p>
            </form>

            <button id="mostrarCadastro" type="button">Criar uma conta</button>

            <form id="cadastroForm" hidden>
                <div class="form-field">
                    <label for="novoNome">Nome:</label>
                    <input id="novoNome" name="nome" type="text" autocomplete="name" required>
                </div>

                <div class="form-field">
                    <label for="novoCpf">CPF:</label>
                    <input id="novoCpf" name="cpf" type="text" autocomplete="username" required>
                </div>

                <div class="form-field">
                    <label for="novaDataNascimento">Data de nascimento:</label>
                    <input id="novaDataNascimento" name="dataNascimento" type="date" required>
                </div>

                <div class="form-field">
                    <label for="novaSenha">Senha:</label>
                    <input id="novaSenha" name="senha" type="password" autocomplete="new-password" required>
                </div>

                <button type="submit">Cadastrar</button>
                <button id="voltarLogin" type="button">Voltar para entrar</button>
                <p id="cadastroFeedback" class="message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
