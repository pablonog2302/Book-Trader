<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookTrader - Painel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="dashboard">
    <aside class="sidebar">
        <a class="brand" href="dashboard.html" aria-label="BookTrader, início">BookTrader</a>
        <p class="sidebar-caption">Trocas que fazem circular histórias.</p>

        <nav aria-label="Navegação principal">
            <button class="nav-item active" data-section="home"
                    onclick="renderSection('home')">
                Início
            </button>

            <button class="nav-item" data-section="livros"
                    onclick="renderSection('livros')">
                Livros
            </button>

            <button class="nav-item" data-section="ofertas"
                    onclick="renderSection('ofertas')">
                Ofertas de troca
            </button>

            <button class="nav-item" data-section="solicitacoes"
                    onclick="renderSection('solicitacoes')">
                Solicitações
            </button>
        </nav>

        <div class="sidebar-account">
            <p class="sidebar-user" id="usuarioLogadoNome" aria-live="polite"></p>
            <button class="logout-btn" type="button" onclick="logoutUsuario()">Sair</button>
        </div>
    </aside>

    <section class="dashboard-content">
        <header class="dashboard-header">
            <p class="eyebrow">Sua comunidade de leitura</p>
            <h2 id="pageTitle">Início</h2>
        </header>

        <div id="pageContent"></div>
    </section>
</main>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
